<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="theme-color" content="#1c1917">
<title>Deutsch Trainer</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231c1917'/%3E%3Ctext x='90' y='122' font-size='96' font-family='Georgia,serif' font-weight='700' fill='%23e7c46a' text-anchor='middle'%3EDe%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#12100e; --bg2:#1c1917; --card:#241f1c; --card2:#2c2622;
  --line:#3a332e; --txt:#f2ede7; --dim:#a89e94; --dim2:#7d746b;
  --gold:#e7c46a; --gold-d:#b9932f;
  --green:#5fb87a; --green-bg:#16281c; --red:#e0736b; --red-bg:#2c1a19;
  --blue:#7aa7d8; --amber:#e0a850;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#faf7f2; --bg2:#fffdf9; --card:#ffffff; --card2:#f4efe7;
    --line:#e2d9cb; --txt:#241f1c; --dim:#6f665c; --dim2:#9a9088;
    --gold:#9a7508; --gold-d:#c9a43c;
    --green:#2f7d4c; --green-bg:#e6f4ea; --red:#b83a30; --red-bg:#fceceb;
    --blue:#2f5f95; --amber:#9a6b12;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{padding-top:var(--safe-t)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--gold)}

/* ---------- shell ---------- */
#app{max-width:820px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 72%,transparent);
  padding:14px 0 10px;margin:0 -14px;padding-left:14px;padding-right:14px;
  display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
.brand span{color:var(--gold)}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;color:var(--dim)}
.iconbtn:active{background:var(--card2)}

/* ---------- tabbar ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg2);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);
  backdrop-filter:blur(12px)}
nav.tabs button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--dim2);border-top:2px solid transparent;margin-top:-1px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--gold);border-top-color:var(--gold)}

/* ---------- cards / lists ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.rowlist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.row:active{background:var(--card2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t small{display:block;color:var(--dim);font-size:12.5px;margin-top:1px}
.row .chev{color:var(--dim2);font-size:18px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);
  color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--green-bg);color:var(--green);border-color:transparent}
.badge.gold{background:rgba(231,196,106,.14);color:var(--gold);border-color:transparent}
.sect{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);
  margin:22px 2px 8px}
.muted{color:var(--dim)}
.tiny{font-size:12.5px}
.center{text-align:center}

/* ---------- exercise ---------- */
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.qnum{font-size:12px;font-weight:700;color:var(--dim2);letter-spacing:.05em}
.prog{height:4px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog>i{display:block;height:100%;background:var(--gold);transition:width .3s}
.prompt{font-size:19px;line-height:1.45;margin:12px 0 4px;font-weight:500}
.prompt .bl{color:var(--gold);font-weight:700;letter-spacing:.05em}
.hint{color:var(--dim);font-size:14.5px;font-style:italic;margin-bottom:14px}
.fields{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.field input{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--bg2);font-size:17px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold-d)}
.field input.ok{border-color:var(--green);background:var(--green-bg)}
.field input.no{border-color:var(--red);background:var(--red-bg)}
.field input.near{border-color:var(--amber)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:13px 16px;border-radius:12px;font-weight:650;font-size:15.5px;
  background:var(--card2);border:1px solid var(--line);text-align:center}
.btn:active{transform:scale(.985)}
.btn.p{background:var(--gold);color:#1c1508;border-color:transparent}
.btn.sm{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:14px;border-radius:10px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--green-bg);color:var(--green)}
.fb.no{background:var(--red-bg);color:var(--red)}
.fb.near{background:rgba(224,168,80,.12);color:var(--amber)}
.fb b{color:var(--txt)}
.fb .alt{display:block;margin-top:6px;font-size:13px;color:var(--dim)}
.kbd{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.kbd button{padding:8px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  font-size:17px;font-weight:600;min-width:42px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{padding:13px 15px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);
  text-align:left;font-size:16px;font-weight:550}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.no{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt:disabled{opacity:.55}

.audioslot audio{width:100%;margin:0 0 10px}
.transcript{margin:0 0 12px}
.transcript .body p{margin:0 0 10px}
.field textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);font:inherit;resize:vertical}
/* ---------- flashcards ---------- */
.fcwrap{perspective:1200px;margin:18px 0}
.fc{min-height:230px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px 20px;
  text-align:center;position:relative;transition:transform .18s}
.fc:active{transform:scale(.99)}
.fc .front{font-size:27px;font-weight:600;line-height:1.3}
.fc .back{font-size:19px;color:var(--gold);font-weight:550}
.fc .extra{font-size:14.5px;color:var(--dim);line-height:1.5}
.fc .tapme{position:absolute;bottom:14px;font-size:11.5px;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase}
.grade{display:flex;gap:8px;margin-top:12px}
.grade button{flex:1;padding:14px 6px;border-radius:13px;font-weight:650;font-size:14.5px;border:1px solid var(--line);background:var(--card2)}
.grade button.g1{color:var(--red)} .grade button.g2{color:var(--amber)} .grade button.g3{color:var(--green)}
.boxes{display:flex;gap:5px;justify-content:center;margin-top:14px}
.boxes i{flex:1;height:5px;border-radius:99px;background:var(--card2)}
.boxes i.f{background:var(--gold)}

/* ---------- grammar ---------- */
.acc{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;overflow:hidden;background:var(--card)}
.acc>summary{padding:13px 15px;font-weight:600;font-size:15.5px;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:10px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'+';margin-left:auto;color:var(--dim2);font-size:20px;font-weight:400}
.acc[open]>summary::after{content:'–'}
.acc .body{padding:0 15px 15px;font-size:15px}
table.g{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
table.g th,table.g td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.g th{background:var(--card2);font-weight:650;font-size:12px;letter-spacing:.03em}
table.g td.k{font-weight:650;color:var(--gold);white-space:nowrap}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
.gnote{background:var(--card2);border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 8px 8px 0;
  font-size:14px;margin:10px 0}
ul.g{margin:8px 0;padding-left:19px} ul.g li{margin:4px 0}
.de{color:var(--gold);font-weight:600}
.fr{color:var(--dim)}

/* ---------- misc ---------- */
.searchbar{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;margin:10px 0}
.searchbar input{flex:1;border:none;background:none;outline:none;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:23px;font-weight:700;color:var(--gold);line-height:1.2}
.stat small{font-size:11px;color:var(--dim2);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chip{padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--dim)}
.chip.on{background:var(--gold);color:#1c1508;border-color:transparent}
.hide{display:none!important}
.fadein{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.done{text-align:center;padding:36px 16px}
.done .big{font-size:52px;line-height:1}
.done h2{margin:14px 0 6px;font-size:23px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Deutsch<span>·</span>Trainer</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="backBtn" style="display:none" onclick="goBack()">‹</button>
    <a class="iconbtn" id="logoutBtn" href="/auth/logout" title="Se déconnecter" aria-label="Se déconnecter" style="text-decoration:none">⏻</a>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs">
  <button data-tab="ex" class="on"><span class="ic">✎</span>Exercices</button>
  <button data-tab="fc"><span class="ic">🂠</span>Flashcards</button>
  <button data-tab="gr"><span class="ic">▤</span>Grammaire</button>
  <button data-tab="st"><span class="ic">◷</span>Progrès</button>
</nav>
<script>
/* ============================================================
   DEUTSCH TRAINER — données
   Généré à partir des fiches du dossier « Deutsch » (AvM)
   ============================================================ */
const EX = [];
function ex(o){ EX.push(o); return o; }

/* helper : items « Genus + Plural »
   g(nom, article, [pluriel...], traduction)                */
function g(n, art, pl, fr){
  const f = [['Artikel', [art]]];
  if (pl && pl.length) f.push(['Plural (die …)', pl]);
  return { p: '<span class="bl">_____</span> ' + n, h: fr, f: f };
}
/* helper : article seul */
function a1(n, art, fr){ return { p:'<span class="bl">_____</span> ' + n, h: fr, f:[['Artikel',[art]]] }; }

/* ---------------- GENUS ÜBUNG 1 ---------------- */
ex({ id:'genus1', cat:'Genus & Plural', title:'Genus Übung 1', file:'Genus Übung 1',
  instr:'Trouvez l’article défini au nominatif, puis le pluriel.', type:'fill', items:[
  g('Abend','der',['die Abende','Abende'],'la soirée'),
  g('Banane','die',['die Bananen','Bananen'],'la banane'),
  g('Carsharing','das',null,'le car sharing'),
  g('Dank','der',null,'le remerciement'),
  g('Egalität','die',null,'l’égalitarisme'),
  g('Fahren','das',null,'la conduite (infinitif substantivé)'),
  g('Garten','der',['die Gärten','Gärten'],'le jardin (*pluriel irrégulier)'),
  g('Handy','das',['die Handys','Handys'],'le téléphone portable'),
  g('Identität','die',['die Identitäten','Identitäten'],'l’identité'),
  g('Januar','der',['die Januare','Januare'],'le mois de janvier'),
  g('Krankheit','die',['die Krankheiten','Krankheiten'],'la maladie'),
  g('Konzerthaus','das',['die Konzerthäuser','Konzerthäuser'],'la salle de concert (*Umlaut)'),
  g('Lampe','die',['die Lampen','Lampen'],'la lampe'),
  g('Minimum','das',null,'le minimum'),
  g('Nebel','der',['die Nebel','Nebel'],'le brouillard'),
  g('Öffnungszeit','die',['die Öffnungszeiten','Öffnungszeiten'],'l’heure d’ouverture'),
  g('Pfeffer','der',null,'le poivre'),
  g('Qualität','die',['die Qualitäten','Qualitäten'],'la qualité'),
  g('Radio','das',['die Radios','Radios'],'la radio'),
  g('Saft','der',['die Säfte','Säfte'],'le jus de fruit'),
  g('Tabelle','die',['die Tabellen','Tabellen'],'le tableau'),
  g('Umbau','der',['die Umbauten','Umbauten'],'la rénovation (*pluriel en -ten)'),
  g('Violett','das',null,'le violet (couleur)'),
  g('Wein','der',['die Weine','Weine'],'le vin'),
  g('Zahl','die',['die Zahlen','Zahlen'],'le chiffre')
]});

/* ---------------- GENUS ÜBUNG 2 ---------------- */
ex({ id:'genus2', cat:'Genus & Plural', title:'Genus Übung 2', file:'Genus Übung 2',
  instr:'Trouvez l’article défini au nominatif, puis le pluriel.', type:'fill', items:[
  g('Absicht','die',['die Absichten','Absichten'],'l’intention'),
  g('Arrangement','das',['die Arrangements','Arrangements'],'l’arrangement (*pluriel en -s)'),
  g('Beginn','der',null,'le début'),
  g('Diagnose','die',['die Diagnosen','Diagnosen'],'le diagnostic'),
  g('Einkauf','der',['die Einkäufe','Einkäufe'],'l’achat'),
  g('Familienleben','das',['die Familienleben','Familienleben'],'la vie de famille'),
  g('Formalität','die',['die Formalitäten','Formalitäten'],'la formalité'),
  g('Gymnasium','das',['die Gymnasien','Gymnasien'],'le lycée (*-um → -en)'),
  g('Höflichkeit','die',['die Höflichkeiten','Höflichkeiten'],'la politesse'),
  g('Kalender','der',['die Kalender','Kalender'],'le calendrier'),
  g('Lobbying','das',null,'le lobbying'),
  g('Mai','der',null,'le mois de mai'),
  g('Mehrheit','die',['die Mehrheiten','Mehrheiten'],'la majorité'),
  g('Nachmittag','der',['die Nachmittage','Nachmittage'],'l’après-midi'),
  g('Orange','die',['die Orangen','Orangen'],'l’orange (fruit)'),
  g('Proletariat','das',null,'le prolétariat'),
  g('Renault','der',['die Renaults','Renaults'],'la Renault (voiture → der)'),
  g('Sache','die',['die Sachen','Sachen'],'l’affaire'),
  g('Schwimmbad','das',['die Schwimmbäder','Schwimmbäder'],'la piscine'),
  g('Streik','der',['die Streiks','Streiks'],'la grève (*pluriel en -s)'),
  g('Telefonat','das',['die Telefonate','Telefonate'],'le coup de téléphone'),
  g('Unterschrift','die',['die Unterschriften','Unterschriften'],'la signature'),
  g('Volontariat','das',['die Volontariate','Volontariate'],'le bénévolat'),
  g('Wagen','der',['die Wagen','Wagen'],'la voiture'),
  g('Zeremonie','die',['die Zeremonien','Zeremonien'],'la cérémonie')
]});

/* ---------------- GENUS WIEDERHOLUNG ---------------- */
ex({ id:'genusW', cat:'Genus & Plural', title:'Genus Wiederholung', file:'AvM 24. April 25',
  instr:'Article + pluriel.', type:'fill', items:[
  g('Arbeitsalltag','der',['die Arbeitsalltage','Arbeitsalltage'],'le quotidien professionnel'),
  g('Bereich','der',['die Bereiche','Bereiche'],'le domaine'),
  g('Datenbank','die',['die Datenbanken','Datenbanken'],'la base de données'),
  g('Grund','der',['die Gründe','Gründe'],'la raison'),
  g('Homeoffice','das',['die Homeoffices','Homeoffices'],'le télétravail'),
  g('Jahr','das',['die Jahre','Jahre'],'l’année'),
  g('Kino','das',['die Kinos','Kinos'],'le cinéma'),
  g('Konzeption','die',['die Konzeptionen','Konzeptionen'],'la conception'),
  g('Regel','die',['die Regeln','Regeln'],'la règle'),
  g('Schule','die',['die Schulen','Schulen'],'l’école'),
  g('Schwierigkeit','die',['die Schwierigkeiten','Schwierigkeiten'],'la difficulté'),
  g('Struktur','die',['die Strukturen','Strukturen'],'la structure'),
  g('Viertel','das',['die Viertel','Viertel'],'le quartier'),
  g('Wiederholung','die',['die Wiederholungen','Wiederholungen'],'la révision'),
  g('Wortschatz','der',['die Wortschätze','Wortschätze'],'le vocabulaire')
]});

/* ---------------- AvM VORSTELLUNG (articles) ---------------- */
ex({ id:'vorstell', cat:'Genus & Plural', title:'Vorstellung — Artikel', file:'AvM Vorstellung',
  instr:'Find den passenden Artikel im Nominativ !', type:'fill', items:[
  a1('Arbeitsalltag','der','le quotidien professionnel'), a1('Arbeitstag','der','la journée de travail'),
  a1('Arbeitsumfeld','das','l’environnement de travail'), a1('Ausland','das','l’étranger'),
  a1('Beispiel','das','l’exemple'), a1('Bereich','der','le domaine'),
  a1('Biochemie','die','la biochimie'), a1('Cocktail','der','le cocktail'),
  a1('Datenbank','die','la base de données'), a1('Deutschkurs','der','le cours d’allemand'),
  a1('Feld','das','le champ, le domaine'), a1('Firma','die','l’entreprise'),
  a1('Fitnessstudio','das','la salle de sport'), a1('Flexibilität','die','la flexibilité'),
  a1('Freizeit','die','le temps libre'), a1('Genetik','die','la génétique'),
  a1('Grund','der','la raison'), a1('Handynummer','die','le numéro de portable'),
  a1('Homeoffice','das','le télétravail'), a1('Jahr','das','l’année'),
  a1('Kino','das','le cinéma'), a1('Kontakt','der','le contact'),
  a1('Konzeption','die','la conception'), a1('Lösung','die','la solution'),
  a1('Mal','das','la fois'), a1('Moment','der','le moment'),
  a1('Problem','das','le problème'), a1('Regel','die','la règle'),
  a1('Rotwein','der','le vin rouge'), a1('Satz','der','la phrase'),
  a1('Schule','die','l’école'), a1('Schwierigkeit','die','la difficulté'),
  a1('Softwareentwicklung','die','le développement logiciel'), a1('Sport','der','le sport'),
  a1('Sprache','die','la langue'), a1('Sprachkenntnis','die','la connaissance linguistique'),
  a1('Stadt','die','la ville'), a1('Struktur','die','la structure'),
  a1('Teil','der','la partie'), a1('Universität','die','l’université'),
  a1('Welt','die','le monde'), a1('Wochenende','das','le week-end'),
  a1('Wortschatz','der','le vocabulaire')
]});

/* ---------------- GENUS INFORMATIK ---------------- */
ex({ id:'genusInfo', cat:'Genus & Plural', title:'Genus Informatik', file:'AvM 25. April 25',
  instr:'Vocabulaire informatique — trouvez l’article.', type:'fill', items:[
  a1('Lastenheft','das','le cahier des charges'), a1('System','das','le système'),
  a1('Modell','das','le modèle'), a1('Prozess','der','le processus'),
  a1('Datenfeld','das','le champ de données'), a1('Index','der','l’index'),
  a1('Cloud','die','le cloud'), a1('Anforderung','die','l’exigence, la demande'),
  a1('Architektur','die','l’architecture'), a1('Konzept','das','le concept'),
  a1('Spezifikation','die','la spécification'), a1('Struktur','die','la structure'),

/* ---------------- SUBSTANTIVIERTE VERBEN ---------------- */
function sv(n, art, pl, inf, pp, fr){
  const f=[['Artikel',[art]]];
  if(pl) f.push(['Plural (die …)',pl]);
  f.push(['Infinitiv',[inf]],['Partizip (hat/ist …)',pp]);
  return { p:'<span class="bl">_____</span> '+n, h:fr, f:f };
}

/* ============================================================
   Construction des exercices à partir des thèmes
   ============================================================ */
function wordItem(w){
  const f = [['Artikel', [w[1]]]];
  if(w[2]) f.push(['Plural (die …)', ['die '+w[2], w[2]]]);
  return { p:'<span class="bl">_____</span> '+w[0], h:w[3], f:f, theme:true };
}
THEMEN.forEach(t=>{
  ex({ id:t.id, cat:'Wortschatz par thème', title:t.icon+'  '+t.title, file:'Vocabulaire thématique',
       instr:'Article défini au nominatif, puis le pluriel.' + (t.note? ' <br><span class="de">Astuce :</span> '+t.note : ''),
       type:'fill', pluralToggle:true, items:t.words.map(wordItem) });
});

/* --- drill mixte : 40 mots au hasard --- */
function pick(arr,n){ const a=arr.slice(); const o=[];
  while(o.length<n && a.length) o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);
  return o; }

/* pv(phrase avec §, particule(s) acceptée(s), traduction) */
function pv(sat, ans, fr){
  return { p: sat.replace('§','<span class="bl">_____</span>'), h: fr,
           f:[['Partikel', Array.isArray(ans)?ans:[ans]]] };
}

/* uv(infinitif, phrase avec § (auxiliaire) et §§ (participe), aux, pp, traduction) */
function uv(inf, sat, aux, pp, fr){
  return { p:'<span class="badge gold">'+inf+'</span><br>'+
             sat.replace('§§','<span class="bl">___________</span>').replace('§','<span class="bl">_____</span>'),
           h: fr, f:[['Hilfsverb (haben/sein)', aux],['Partizip II', pp]] };
}

   DIE UHRZEIT — générateur
   ============================================================ */
const ZAHL = ['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf',
 'dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig'];
const ZEHNER = {30:'dreißig',40:'vierzig',50:'fünfzig'};
function zahlWort(n){
  if(n<=20) return ZAHL[n];
  if(n%10===0) return n===20?'zwanzig':ZEHNER[n];
  const e = n<30 ? 'zwanzig' : ZEHNER[Math.floor(n/10)*10];
  return ZAHL[n%10].replace(/^eins$/,'ein') + 'und' + e;
}
function h12(h){ let x=h%12; if(x===0)x=12; return x; }
function stundeWort(h,eins){ const x=h12(h); return (x===1&&eins)?'eins':(x===1?'ein':ZAHL[x]); }

/* toutes les formulations informelles acceptées pour h:m */
function informell(h,m){
  const H=stundeWort(h,true), H1=stundeWort(h+1,true), out=[];
  const nx = stundeWort(h+1,false);
  if(m===0){ out.push('Es ist '+H+'.'); out.push('Es ist '+stundeWort(h,false)+' Uhr.'); }
  else if(m===15){ out.push('Es ist Viertel nach '+H+'.'); }
  else if(m===30){ out.push('Es ist halb '+H1+'.'); }
  else if(m===45){ out.push('Es ist Viertel vor '+H1+'.'); out.push('Es ist drei Viertel '+H1+'.'); }
  else if(m<20){ out.push('Es ist '+zahlWort(m)+' nach '+H+'.'); }
  else if(m<30){ out.push('Es ist '+zahlWort(30-m)+' vor halb '+H1+'.'); out.push('Es ist '+zahlWort(m)+' nach '+H+'.'); }
  else if(m<=40){ out.push('Es ist '+zahlWort(m-30)+' nach halb '+H1+'.'); out.push('Es ist '+zahlWort(60-m)+' vor '+H1+'.'); }
  else { out.push('Es ist '+zahlWort(60-m)+' vor '+H1+'.'); }
  return out;
}
function formell(h,m){
  const out=[];
  const hw = h===1?'ein':(h===0?'null':zahlWort(h));
  if(m===0) out.push('Es ist '+hw+' Uhr.');
  else out.push('Es ist '+hw+' Uhr '+zahlWort(m)+'.');
  return out;
}
function uhrzeitItem(h,m){
  const hh=String(h).padStart(2,'0'), mm=String(m).padStart(2,'0');
  return {
    p:'<div style="font-size:44px;font-weight:700;letter-spacing:.02em;margin:6px 0">'+hh+':'+mm+'</div>',
    h:'', f:[['informell (halb / Viertel / nach / vor)', informell(h,m)],
             ['formell (24 h)', formell(h,m)]]
  };
}
function uhrzeitSet(n){
  const arr=[], seen={};
  const fixed=[[1,0],[6,30],[15,20],[19,40],[10,10],[14,55],[17,15],[21,45],[23,35],[8,25]];
  fixed.forEach(t=>{arr.push(uhrzeitItem(t[0],t[1]));seen[t[0]+':'+t[1]]=1;});
  while(arr.length<n){
    const h=Math.floor(Math.random()*24), m=Math.floor(Math.random()*12)*5;
    if(seen[h+':'+m]) continue; seen[h+':'+m]=1; arr.push(uhrzeitItem(h,m));
  }
  return arr;
}

/* --- 3. Genus des noms (construit à partir des exercices) --- */
function cardsFromGenus(ids){
  const out=[];
  ids.forEach(id=>{
    const e = EX.find(x=>x.id===id); if(!e) return;
    e.items.forEach(it=>{
      const noun = it.p.replace(/<[^>]+>/g,'').replace(/_+/g,'').trim();
      const art = it.f[0][1][0];
      const pl = it.f[1] ? it.f[1][1][0] : null;
      out.push({ f: noun, b: art+' '+noun + (pl? ' — '+pl : ''), x: it.h });
    });
  });
  return out;
}

/* ============================================================
   APPLICATION
   ============================================================ */

/* ---------- stockage ---------- */
const KEY = 'deutschTrainer.v1';
let S = { ex:{}, fc:{}, streak:{last:null,n:0}, seen:0, right:0, opts:{plural:true} };
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
  if(!S.opts) S.opts = {plural:true};
}
let STORAGE_OK = true;
try{ localStorage.setItem('__dt','1'); localStorage.removeItem('__dt'); }catch(e){ STORAGE_OK = false; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ STORAGE_OK = false; } }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchStreak(){
  const t = todayStr();
  if(S.streak.last === t) return;
  const y = new Date(Date.now()-864e5); const ys = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  S.streak.n = (S.streak.last === ys) ? S.streak.n+1 : 1;
  S.streak.last = t; save();
}
load();

/* ---------- normalisation & comparaison ---------- */
function base(s){
  return String(s)
    .replace(/<[^>]+>/g,'')
    .toLowerCase()
    .replace(/[’‘`´]/g,"'")
    .replace(/[“”«»]/g,'"')
    .replace(/\s+/g,' ')
    .replace(/^[\s.]+|[\s.!?]+$/g,'')
    .trim();
}
function strict(s){ return base(s).replace(/ß/g,'ss'); }
function loose(s){
  return strict(s)
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9 ]/g,'');
}
/* 0 = faux, 1 = presque (umlauts / ponctuation), 2 = juste */
function grade(input, answers){
  const i = strict(input); if(!i) return 0;
  for(const a of answers) if(i === strict(a)) return 2;
  const li = loose(input);
  for(const a of answers) if(li === loose(a)) return 1;
  /* tolérance : réponse sans l'article/majuscule initiale déjà couverte par strict */
  return 0;
}

/* ---------- helpers DOM ---------- */
const $ = s => document.querySelector(s);
const V = () => $('#view');
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- navigation ---------- */
let TAB = 'ex';
let STACK = [];
function goBack(){ STACK.pop(); const f = STACK[STACK.length-1]; if(f) f(); else render(); }
function push(fn){ STACK.push(fn); fn(); }
function setBack(on){ $('#backBtn').style.display = on ? 'grid' : 'none'; }

document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); TAB = b.dataset.tab; STACK=[]; render(); window.scrollTo(0,0);
  };
});

function render(){
  setBack(false);
  if(AUDIO_EL && !AUDIO_EL.paused) AUDIO_EL.pause();
  if(TAB==='ex') viewExList();
  else if(TAB==='fc') viewDeckList();
  else if(TAB==='gr') viewGrammar();
  else viewStats();
}

/* ============================================================
   ONGLET EXERCICES
   ============================================================ */
function exState(id){ return S.ex[id] || (S.ex[id]={done:0,right:0,best:0,total:0}); }

function exCount(e){ if(e._n==null) e._n = e.gen ? e.gen().length : e.items.length; return e._n; }
function viewExList(){
  const cats = {};
  EX.forEach(e=>{ (cats[e.cat] = cats[e.cat]||[]).push(e); });
  let h = '<div class="card"><b>Exercices</b><div class="tiny muted" style="margin-top:4px">'+
    EX.length+' séries · '+EX.reduce((n,e)=>n+exCount(e),0)+
    ' questions, tirées de vos fiches. Tapez votre réponse, l’application corrige.</div></div>';
  Object.keys(cats).forEach(c=>{
    h += '<div class="sect">'+c+'</div><div class="rowlist">';
    cats[c].forEach(e=>{
      const st = exState(e.id);
      const n = exCount(e);
      const pct = st.total ? Math.round(100*st.best) : 0;
      h += '<button class="row" onclick="startEx(\''+e.id+'\')"><div class="t"><b>'+e.title+'</b>'+
           '<small>'+n+' questions · '+e.file+'</small></div>'+
           (st.total? '<span class="badge '+(pct>=80?'ok':'')+'">'+pct+' %</span>' : '')+
           '<span class="chev">›</span></button>';
    });
    h += '</div>';
  });
  V().innerHTML = h;
}

let R = null; /* run courant */
function fieldsFor(e, it){
  if(e.pluralToggle && !S.opts.plural && it.f.length>1) return [it.f[0]];
  return it.f;
}
function setPlural(v){ S.opts.plural = !!v; save(); renderQ(); }
function startEx(id){
  const e = EX.find(x=>x.id===id);
  const items = e.gen ? e.gen() : e.items.slice();
  R = { e:e, items: shuffle(items), i:0, right:0, checked:false, wrong:[] };
  push(()=>renderQ());
}
function restartEx(){ startEx(R.e.id); }

function renderQ(){
  setBack(true);
  const {e, items, i} = R;
  if(i >= items.length) return renderDone();
  const it = items[i];
  let h = '<div class="qhead"><span class="qnum">'+(i+1)+' / '+items.length+'</span>'+
          '<span class="tiny muted">'+e.title+'</span></div>'+
          '<div class="prog"><i style="width:'+(100*i/items.length)+'%"></i></div>';
  h += '<div class="card fadein">';
  if(e.audio) h += '<div id="audioSlot" class="audioslot"></div>';
  if(e.text) h += '<details class="acc transcript"><summary>Transkript anzeigen</summary><div class="body">'+e.text+'</div></details>';
  if(i===0 && e.instr) h += '<div class="tiny muted" style="margin-bottom:8px">'+e.instr+'</div>';
  h += '<div class="prompt">'+it.p+'</div>';
  if(it.h) h += '<div class="hint">'+it.h+'</div>';

  if(e.type==='open'){
    h += '<div class="fields"><div class="field"><label>Votre réponse</label>'+
         '<textarea id="openIn" rows="4" autocapitalize="sentences" spellcheck="false"></textarea></div></div>';
    h += '<div class="kbd">'+['ä','ö','ü','ß'].map(k=>'<button onclick="insert(\''+k+'\')">'+k+'</button>').join('')+'</div>';
    h += '<div id="fb"></div><div class="btns" id="btns">'+
         '<button class="btn p" onclick="showModel()">Voir la réponse modèle</button></div>';
  } else if(e.type==='mcq'){
    h += '<div class="opts" id="opts">';
    it.o.forEach((o,k)=> h += '<button class="opt" data-k="'+k+'" onclick="pickMcq('+k+')">'+o+'</button>');
    h += '</div><div id="fb"></div>';
    h += '<div class="btns" id="btns"></div>';
  } else {
    R.cur = fieldsFor(e, it);
    if(e.pluralToggle){
      h += '<div class="chips"><button class="chip'+(S.opts.plural?'':' on')+'" onclick="setPlural(0)">Artikel seul</button>'+
           '<button class="chip'+(S.opts.plural?' on':'')+'" onclick="setPlural(1)">Artikel + Plural</button></div>';
    }
    h += '<div class="fields">';
    R.cur.forEach((f,k)=>{
      h += '<div class="field"><label>'+f[0]+'</label>'+
           '<input id="in'+k+'" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" '+
           'enterkeyhint="'+(k===R.cur.length-1?'done':'next')+'" '+
           (it.long?'':'')+'></div>';
    });
    h += '</div>';
    const keys = (e.keys||[]).concat(['ä','ö','ü','ß']);
    h += '<div class="kbd">'+ keys.map(k=>'<button onclick="insert(\''+k+'\')">'+k+'</button>').join('') +'</div>';
    h += '<div id="fb"></div><div class="btns" id="btns">'+
         '<button class="btn p" onclick="check()">Vérifier</button>'+
         '<button class="btn" onclick="reveal()">Voir la réponse</button></div>';
  }
  h += '</div>';
  V().innerHTML = h;
  mountAudio(e);
  if(e.type==='open'){ const ta=$('#openIn'); if(ta) ta.focus({preventScroll:true}); }
  const first = document.querySelector('#in0');
  if(first){
    first.focus({preventScroll:true});
    document.querySelectorAll('.field input').forEach((inp,k,all)=>{
      inp.addEventListener('keydown', ev=>{
        if(ev.key!=='Enter') return; ev.preventDefault();
        if(R.checked) return next();
        if(k < all.length-1) all[k+1].focus(); else check();
      });
    });
  }
  R.checked=false;
}

let LAST_INPUT = null;
document.addEventListener('focusin', e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') LAST_INPUT=e.target; });
function insert(ch){
  const el = (LAST_INPUT && document.body.contains(LAST_INPUT)) ? LAST_INPUT : (document.querySelector('#in0')||document.querySelector('#openIn')); if(!el) return;
  const s = el.selectionStart||el.value.length, e2 = el.selectionEnd||s;
  el.value = el.value.slice(0,s)+ch+el.value.slice(e2);
  el.focus(); el.setSelectionRange(s+ch.length, s+ch.length);
}

function check(){
  if(R.checked) return next();
  const it = R.items[R.i];
  let allOk = true, near = false;
  const details = [];
  (R.cur||it.f).forEach((f,k)=>{
    const inp = document.querySelector('#in'+k);
    const g = grade(inp.value, f[1]);
    inp.classList.remove('ok','no','near');
    inp.classList.add(g===2?'ok':(g===1?'near':'no'));
    if(g===0) allOk = false;
    if(g===1) near = true;
    details.push({label:f[0], ans:f[1], g:g});
  });
  R.checked = true;
  S.seen++; if(allOk) S.right++;
  const st = exState(R.e.id);
  if(allOk) R.right++; else R.wrong.push(it);
  showFB(allOk, near, details);
  save();
}
function showFB(ok, near, details){
  let cls = ok ? (near?'near':'ok') : 'no';
  let msg = ok ? (near ? 'Presque — attention aux Umlaute / à l’orthographe.' : 'Richtig! ✓') : 'Pas tout à fait.';
  let h = '<div class="fb '+cls+'">'+msg;
  details.forEach(d=>{
    if(d.g<2 || near) h += '<span class="alt"><b>'+d.label+'</b> : '+d.ans.map(a=>'<b>'+a+'</b>').join(' &nbsp;·&nbsp; ')+'</span>';
  });
  h += '</div>';
  $('#fb').innerHTML = h;
  $('#btns').innerHTML = '<button class="btn p" onclick="next()">Suivant ›</button>'+
    (ok?'':'<button class="btn" onclick="retry()">Réessayer</button>');
  const b=$('#btns').querySelector('.btn.p'); if(b) b.focus({preventScroll:true});
}
function retry(){
  R.checked=false;
  document.querySelectorAll('.field input').forEach(i=>{i.classList.remove('ok','no','near');i.value='';});
  $('#fb').innerHTML='';
  $('#btns').innerHTML = '<button class="btn p" onclick="check()">Vérifier</button>'+
    '<button class="btn" onclick="reveal()">Voir la réponse</button>';
  const f=document.querySelector('#in0'); if(f) f.focus({preventScroll:true});
}
function reveal(){
  const it = R.items[R.i];
  (R.cur||it.f).forEach((f,k)=>{ const inp=document.querySelector('#in'+k); inp.value=f[1][0]; inp.classList.add('near'); });
  R.checked = true; R.wrong.push(it); S.seen++;
  $('#fb').innerHTML = '<div class="fb near">Réponse affichée. Relisez-la à voix haute avant de continuer.</div>';
  $('#btns').innerHTML = '<button class="btn p" onclick="next()">Suivant ›</button>';
  save();
}
function pickMcq(k){
  if(R.checked) return;
  const it = R.items[R.i]; R.checked = true;
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===it.a) b.classList.add('ok');
    else if(j===k) b.classList.add('no');
  });
  const ok = k===it.a;
  S.seen++; if(ok){S.right++; R.right++;} else R.wrong.push(it);
  $('#fb').innerHTML = '<div class="fb '+(ok?'ok':'no')+'">'+(ok?'Richtig! ✓':'La bonne réponse : <b>'+it.o[it.a]+'</b>')+'</div>';
  $('#btns').innerHTML = '<button class="btn p" onclick="next()">Suivant ›</button>';
  save();
}
function next(){ R.i++; renderQ(); window.scrollTo(0,0); }

/* ---------- audio persistant (la lecture continue d'une question à l'autre) ---------- */
let AUDIO_EL = null;
function mountAudio(e){
  const slot = document.querySelector('#audioSlot');
  if(!e.audio || !slot){ if(AUDIO_EL && !AUDIO_EL.paused) AUDIO_EL.pause(); return; }
  if(!AUDIO_EL){ AUDIO_EL = document.createElement('audio'); AUDIO_EL.controls = true; AUDIO_EL.preload = 'metadata'; }
  if(AUDIO_EL.getAttribute('src') !== e.audio) AUDIO_EL.setAttribute('src', e.audio);
  slot.appendChild(AUDIO_EL);
}

/* ---------- questions ouvertes (auto-évaluation) ---------- */
function showModel(){
  if(R.checked) return;
  const it = R.items[R.i];
  const ta = $('#openIn'); if(ta) ta.readOnly = true;
  $('#fb').innerHTML = '<div class="fb near"><b>Réponse modèle</b><span class="alt">'+it.a+'</span></div>';
  $('#btns').innerHTML = '<button class="btn p" onclick="selfGrade(1)">J’avais juste</button>'+
    '<button class="btn" onclick="selfGrade(0)">À revoir</button>';
}
function selfGrade(ok){
  if(R.checked) return;
  const it = R.items[R.i];
  R.checked = true; S.seen++;
  if(ok){ S.right++; R.right++; } else R.wrong.push(it);
  save(); next();
}

function renderDone(){
  const st = exState(R.e.id);
  const score = R.right / R.items.length;
  st.done++; st.total = R.items.length; st.right = R.right;
  st.best = Math.max(st.best||0, score);
  touchStreak(); save();
  const pct = Math.round(score*100);
  let mot = pct===100?'Perfekt!' : pct>=80?'Sehr gut!' : pct>=60?'Gut gemacht.' : 'Weiter üben!';
  let h = '<div class="done fadein"><div class="big">'+(pct>=80?'🎉':'💪')+'</div>'+
    '<h2>'+mot+'</h2><p class="muted">'+R.right+' / '+R.items.length+' — '+pct+' %</p>'+
    '<div class="btns" style="max-width:420px;margin:20px auto">'+
    (R.wrong.length? '<button class="btn p" onclick="redoWrong()">Refaire les '+R.wrong.length+' erreurs</button>':'')+
    '<button class="btn'+(R.wrong.length?'':' p')+'" onclick="restartEx()">Recommencer</button>'+
    '<button class="btn" onclick="TAB=\'ex\';STACK=[];render()">Retour à la liste</button></div></div>';
  V().innerHTML = h;
  setBack(true);
}
function redoWrong(){
  R = { e:R.e, items: shuffle(R.wrong), i:0, right:0, checked:false, wrong:[] };
  renderQ();
}

/* ============================================================
   ONGLET FLASHCARDS  (Leitner, 5 boîtes)
   ============================================================ */
const INTERVALS = [0, 1, 3, 7, 21]; /* jours par boîte */
function deckCards(d){ if(!d._c) d._c = d.build ? d.build() : d.cards; return d._c; }
function fcState(did){ return S.fc[did] || (S.fc[did] = {}); }
function cardKey(c){ return c.f.slice(0,40); }
function dueCards(d){
  const st = fcState(d.id), now = Date.now(), out=[];
  deckCards(d).forEach(c=>{
    const s = st[cardKey(c)];
    if(!s) out.push(c);
    else if(s.due <= now) out.push(c);
  });
  return out;
}
function deckStats(d){
  const st = fcState(d.id), cards = deckCards(d);
  let learned=0, boxes=[0,0,0,0,0];
  cards.forEach(c=>{ const s=st[cardKey(c)]; if(s){ boxes[s.box]++; if(s.box>=3) learned++; } });
  return {n:cards.length, due:dueCards(d).length, learned:learned, boxes:boxes};
}

function viewDeckList(){
  let h = '<div class="card"><b>Flashcards</b><div class="tiny muted" style="margin-top:4px">'+
    'Répétition espacée (5 boîtes). Les cartes réussies reviennent après 1, 3, 7 puis 21 jours.</div></div>';
  const cats = {};
  DECKS.forEach(d=>{ (cats[d.cat||'Autres'] = cats[d.cat||'Autres']||[]).push(d); });
  Object.keys(cats).forEach(c=>{
    h += '<div class="sect">'+c+'</div><div class="rowlist">';
    cats[c].forEach(d=>{
      const s = deckStats(d);
      h += '<button class="row" onclick="startDeck(\''+d.id+'\')"><div class="t"><b>'+d.title+'</b>'+
           '<small>'+d.sub+' · '+s.n+' cartes</small></div>'+
           (s.due? '<span class="badge gold">'+s.due+' à revoir</span>' : '<span class="badge ok">à jour</span>')+
           '<span class="chev">›</span></button>';
    });
    h += '</div>';
  });
  V().innerHTML = h;
}

let F = null;
function startDeck(id){
  const d = DECKS.find(x=>x.id===id);
  let cards = dueCards(d);
  if(!cards.length) cards = shuffle(deckCards(d)).slice(0,20);
  F = { d:d, cards: shuffle(cards), i:0, flipped:false, done:0 };
  push(()=>renderCard());
}
function renderCard(){
  setBack(true);
  if(F.i >= F.cards.length){
    touchStreak(); save();
    V().innerHTML = '<div class="done fadein"><div class="big">✓</div><h2>Session terminée</h2>'+
      '<p class="muted">'+F.done+' cartes revues — '+F.d.title+'</p>'+
      '<div class="btns" style="max-width:420px;margin:20px auto">'+
      '<button class="btn p" onclick="startDeck(\''+F.d.id+'\')">Encore une série</button>'+
      '<button class="btn" onclick="TAB=\'fc\';STACK=[];render()">Retour aux paquets</button></div></div>';
    return;
  }
  const c = F.cards[F.i];
  const st = fcState(F.d.id)[cardKey(c)];
  const box = st ? st.box : 0;
  let h = '<div class="qhead"><span class="qnum">'+(F.i+1)+' / '+F.cards.length+'</span>'+
          '<span class="tiny muted">'+F.d.title+'</span></div>'+
          '<div class="prog"><i style="width:'+(100*F.i/F.cards.length)+'%"></i></div>';
  h += '<div class="fcwrap"><div class="fc fadein" onclick="flip()">'+
       '<div class="front">'+c.f+'</div>';
  if(F.flipped){
    h += '<div class="back">'+c.b+'</div>';
    if(c.x) h += '<div class="extra">'+c.x+'</div>';
  } else {
    h += '<div class="tapme">toucher pour retourner</div>';
  }
  h += '<div class="boxes">'+[0,1,2,3,4].map(i=>'<i class="'+(i<=box?'f':'')+'"></i>').join('')+'</div>';
  h += '</div></div>';
  if(F.flipped){
    h += '<div class="grade">'+
      '<button class="g1" onclick="gradeCard(0)">À revoir</button>'+
      '<button class="g2" onclick="gradeCard(1)">Hésitant</button>'+
      '<button class="g3" onclick="gradeCard(2)">Facile</button></div>';
  } else {
    h += '<div class="btns"><button class="btn p" onclick="flip()">Retourner</button></div>';
  }
  V().innerHTML = h;
}
function flip(){ F.flipped = !F.flipped; renderCard(); }
function gradeCard(q){
  const c = F.cards[F.i], st = fcState(F.d.id), k = cardKey(c);
  const cur = st[k] || {box:0};
  let box = cur.box;
  if(q===0) box = 0;
  else if(q===1) box = Math.max(1, box);
  else box = Math.min(4, box+1);
  st[k] = { box: box, due: Date.now() + INTERVALS[box]*864e5 };
  F.done++; F.i++; F.flipped=false; save(); renderCard(); window.scrollTo(0,0);
}

/* ============================================================
   ONGLET GRAMMAIRE
   ============================================================ */
function viewGrammar(){
  let h = '<div class="searchbar"><span class="muted">⌕</span>'+
    '<input id="gq" placeholder="Chercher dans la grammaire…" oninput="filterGrammar()"></div><div id="glist">';
  GRAMMAR.forEach(g=>{
    h += '<details class="acc" data-t="'+esc(g.t+' '+g.s).toLowerCase()+'"><summary>'+g.t+
         '<span class="badge" style="margin-left:auto;margin-right:6px">'+g.s+'</span></summary>'+
         '<div class="body">'+g.html+'</div></details>';
  });
  h += '</div>';
  V().innerHTML = h;
}
function filterGrammar(){
  const q = base($('#gq').value);
  document.querySelectorAll('#glist details').forEach(d=>{
    const hay = d.dataset.t + ' ' + d.textContent.toLowerCase();
    d.classList.toggle('hide', q && hay.indexOf(q)<0);
  });
}

/* ============================================================
   ONGLET PROGRÈS
   ============================================================ */
function viewStats(){
  const pct = S.seen ? Math.round(100*S.right/S.seen) : 0;
  let h0 = '';
  if(!STORAGE_OK) h0 = '<div class="card" style="border-color:var(--amber)">'+
    '<b style="color:var(--amber)">⚠ Progression non enregistrée</b>'+
    '<div class="tiny muted" style="margin-top:5px">Cette page est ouverte depuis un fichier local : le navigateur '+
    'n’autorise pas le stockage. L’application fonctionne, mais les scores et les flashcards repartent de zéro '+
    'à la fermeture. Ouvrez-la depuis une adresse <b>https://</b> (voir la note en bas) pour tout conserver.</div></div>';
  let learned = 0, totalCards = 0;
  DECKS.forEach(d=>{ const s=deckStats(d); learned+=s.learned; totalCards+=s.n; });
  let h = h0 + '<div class="stats">'+
    '<div class="stat"><b>'+S.streak.n+'</b><small>jours de suite</small></div>'+
    '<div class="stat"><b>'+S.seen+'</b><small>questions</small></div>'+
    '<div class="stat"><b>'+pct+'%</b><small>réussite</small></div></div>';
  h += '<div class="sect">Exercices</div><div class="rowlist">';
  const doneEx = EX.filter(e=>S.ex[e.id] && S.ex[e.id].total);
  if(!doneEx.length) h += '<div class="card muted tiny">Aucun exercice terminé pour l’instant.</div>';
  doneEx.forEach(e=>{
    const st = S.ex[e.id]; const p = Math.round(100*st.best);
    h += '<button class="row" onclick="startEx(\''+e.id+'\')"><div class="t"><b>'+e.title+'</b>'+
         '<small>'+st.done+' passage'+(st.done>1?'s':'')+' · meilleur score</small></div>'+
         '<span class="badge '+(p>=80?'ok':'')+'">'+p+' %</span><span class="chev">›</span></button>';
  });
  h += '</div>';
  h += '<div class="sect">Flashcards — '+learned+' / '+totalCards+' cartes mémorisées</div><div class="rowlist">';
  const actifs = DECKS.filter(d=>{ const s=deckStats(d); return s.learned>0 || s.boxes.some(b=>b>0); });
  if(!actifs.length) h += '<div class="card muted tiny">Aucune carte revue pour l’instant.</div>';
  actifs.forEach(d=>{
    const s = deckStats(d);
    const p = s.n ? Math.round(100*s.learned/s.n) : 0;
    h += '<button class="row" onclick="startDeck(\''+d.id+'\')"><div class="t"><b>'+d.title+'</b>'+
         '<small>'+s.due+' à revoir aujourd’hui</small></div>'+
         '<span class="badge '+(p>=80?'ok':'')+'">'+p+' %</span><span class="chev">›</span></button>';
  });
  h += '</div>';
  h += '<div class="sect">Données</div><div class="card">'+
    '<div class="tiny muted">Votre progression est enregistrée sur cet appareil uniquement.</div>'+
    '<div class="btns"><button class="btn" onclick="resetAll()">Réinitialiser la progression</button></div></div>';
  h += '<div class="card tiny muted center" style="margin-top:20px">Deutsch·Trainer — construit à partir de vos 52 fiches AvM.<br><br>'+
       '<b>Sur iPhone</b> : ouvrez cette page dans Safari à une adresse <b>https://</b>, puis '+
       '<b>Partager → Sur l’écran d’accueil</b>. Vous obtenez une icône, le plein écran, '+
       'le fonctionnement hors-ligne et la sauvegarde de la progression.</div>';
  V().innerHTML = h;
}
function resetAll(){
  if(!confirm('Effacer toute la progression ?')) return;
  S = { ex:{}, fc:{}, streak:{last:null,n:0}, seen:0, right:0 }; save(); render();
}

/* ---------- nettoyage des réponses (doublons) ---------- */
EX.forEach(e=>{
  (e.items||[]).forEach(it=>{
    if(!it.f) return;
    it.f.forEach(f=>{ const s=new Set(), o=[]; f[1].forEach(a=>{const k=strict(a); if(!s.has(k)){s.add(k);o.push(a);}}); f[1]=o; });
  });
});
const _gen = {};
EX.forEach(e=>{ if(!e.gen) return; const g=e.gen;
  e.gen = ()=> g().map(it=>{ if(it.f) it.f.forEach(f=>{ const s=new Set(), o=[];
    f[1].forEach(a=>{const k=strict(a); if(!s.has(k)){s.add(k);o.push(a);}}); f[1]=o; }); return it; });
});

/* ---------- Wochentage dynamiques ---------- */
(function(){
  const e = EX.find(x=>x.id==='wochentage'); if(!e) return;
  const idx = new Date().getDay(); /* 0 = dimanche */
  const jsToDe = [6,0,1,2,3,4,5];  /* Montag = 0 */
  const t = jsToDe[idx];
  const d = n => TAGE[((t+n)%7+7)%7];
  e.items = [
    { p:'Welcher Tag ist heute?', h:'', f:[['Tag',[d(0)]]] },
    { p:'Welcher Tag war gestern?', h:'', f:[['Tag',[d(-1)]]] },
    { p:'Welcher Tag ist morgen?', h:'', f:[['Tag',[d(1)]]] },
    { p:'Welcher Tag war vorgestern?', h:'', f:[['Tag',[d(-2)]]] },
    { p:'Welcher Tag ist übermorgen?', h:'', f:[['Tag',[d(2)]]] }
  ].concat(e.items);
})();

/* ---------- démarrage ---------- */
render();
</script>
